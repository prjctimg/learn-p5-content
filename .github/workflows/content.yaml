name: Publish Content Pack

on:
  workflow_dispatch:
    inputs:
      content_version:
        description: Content version (optional)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "courses/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test reference formatting
        run: npm test

      - name: Generate reference data
        run: node scripts/build/reference.mjs

      - name: Bundle validation core
        run: node scripts/bundle/validation.mjs

      # check-exercises uses @lezer/javascript's parser, which is a dev-only
      # tool (not part of the pack build) and intentionally not locked: install
      # it ad hoc so the committed lockfile stays exactly as published.
      - name: Install lezer parser for exercise checks
        run: npm install --no-save @lezer/javascript@1.5.4

      - name: Check exercise invariants
        run: node scripts/check/exercises.mjs && node scripts/check/symbols.mjs

      - name: Build content pack
        env:
          CONTENT_VERSION: ${{ inputs.content_version }}
        run: node scripts/build/content.mjs

      - name: Publish content pack to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: content-latest
          name: Learn P5 Content
          body: Downloadable course content for Learn P5.
          make_latest: false
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            content/manifest.json
            content/pack.json
