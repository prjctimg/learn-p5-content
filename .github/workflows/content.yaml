name: Publish Content Pack

on:
  workflow_dispatch:
    inputs:
      content_version:
        description: Content version (optional)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "courses/**"
      - "build-content*.mjs"
      - "generate-reference.mjs"
      - "bundle-p5.mjs"
      - "p5-version.mjs"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate reference data
        run: node generate-reference.mjs

      - name: Bundle p5.js
        run: node bundle-p5.mjs

      - name: Build content pack
        env:
          CONTENT_VERSION: ${{ inputs.content_version }}
        run: node build-content.mjs

      - name: Publish content pack to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: content-latest
          name: Learn P5 Content
          body: Downloadable course content for Learn P5.
          make_latest: false
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            content/manifest.json
            content/pack.json
