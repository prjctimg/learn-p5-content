name: Publish Content Pack

on:
  workflow_dispatch:
    inputs:
      content_version:
        description: Content version (optional)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - "courses/**"
      - "build-content*.mjs"
      - "generate-reference.mjs"
      - "bundle-p5.mjs"
      - "p5-version.mjs"
      - "p5-runtime-compat.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate reference data
        run: node generate-reference.mjs

      - name: Bundle validation core
        run: node bundle-validation.mjs

      # check-exercises uses @lezer/javascript's parser, which is a dev-only
      # tool (not part of the pack build) and intentionally not locked: install
      # it ad hoc so the committed lockfile stays exactly as published.
      - name: Install lezer parser for exercise checks
        run: npm install --no-save @lezer/javascript@1.5.4

      - name: Check exercise invariants
        run: node check-exercises.mjs && node check-symbols.mjs

      - name: Bundle p5.js
        run: node bundle-p5.mjs

      - name: Build content pack
        env:
          CONTENT_VERSION: ${{ inputs.content_version }}
        run: node build-content.mjs

      - name: Publish content pack to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: content-latest
          name: Learn P5 Content
          body: Downloadable course content for Learn P5.
          make_latest: false
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            content/manifest.json
            content/pack.json
            content/p5.min.js
